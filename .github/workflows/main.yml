name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Test Mitra Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Fix KSP CI compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/googleDevtoolsKsp = "2.3.10"/googleDevtoolsKsp = "2.3.9"/' gradle/libs.versions.toml
          fi

          echo "KSP configuration:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

      - name: Create Debug Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Test-Mitra-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
