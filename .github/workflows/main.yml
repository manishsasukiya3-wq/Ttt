name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Test Mitra Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.properties
            gradle/*.versions.toml
            gradle/wrapper/gradle-wrapper.properties
          problem-matchers: false

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Use stable KSP version for CI
        run: |
          sed -i 's/googleDevtoolsKsp = "2.3.10"/googleDevtoolsKsp = "2.3.9"/' gradle/libs.versions.toml
          grep 'googleDevtoolsKsp' gradle/libs.versions.toml

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Test-Mitra-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
